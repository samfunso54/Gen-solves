<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 120" fill="none">
  <!-- Emblem Group -->
  <g transform="translate(10, 0)">
    <!-- Top Neon Green Sparkle / Star -->
    <path d="M46 10 C46 22 55 28 66 28 C55 28 46 34 46 46 C46 34 37 28 26 28 C37 28 46 22 46 10 Z" fill="#38EF7D" />

    <!-- Upper Electric Blue Chevron with Terminal Node -->
    <path d="M72 50 L34 60 L70 70" stroke="#1D63FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="70" cy="70" r="5" fill="#1D63FF" stroke="#1D63FF" stroke-width="2" />

    <!-- Lower Dark Circuit Arm with Node -->
    <line x1="20" y1="88" x2="64" y2="72" stroke="#0B132B" stroke-width="8" stroke-linecap="round" />
    <circle cx="20" cy="88" r="8" fill="#FFFFFF" stroke="#0B132B" stroke-width="5" />
  </g>

  <!-- Typography: Gen Solves -->
  <text x="110" y="78" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#FFFFFF">Gen</tspan>
    <tspan fill="#1D63FF"> Solves</tspan>
  </text>
</svg>
